const Ctx = React.createContext(null);

function AppProvider({children}){
  const [lang,setLang]   = React.useState(gl('nmms_lang','en'));
  const [dark,setDark]   = React.useState(gl('nmms_dark',false));
  const [admin,setAdmin] = React.useState(gl('nmms_admin',false));
  const [page,setPage]   = React.useState('home');
  const [pageData,setPD] = React.useState(null);
  const [logoClicks,setLC]= React.useState(0);
  const [showAdminLogin,setSAL]= React.useState(false);

  const [questions, setQuestions]   = React.useState(gl('nmms_q', DEMO_QUESTIONS));
  const [materials, setMaterials]   = React.useState(gl('nmms_m', DEMO_MATERIALS));
  const [mockTests, setMockTests]   = React.useState(gl('nmms_t', DEMO_TESTS));
  const [papers, setPapers]         = React.useState(gl('nmms_p', DEMO_PAPERS));
  const [anns, setAnns]             = React.useState(gl('nmms_a', DEMO_ANNS));
  const [daily, setDaily]           = React.useState(gl('nmms_d', DEMO_DAILY));
  const [toast, setToast]           = React.useState(null);

  React.useEffect(()=>{ document.documentElement.classList.toggle('dark',dark); sl('nmms_dark',dark); },[dark]);
  React.useEffect(()=>{ sl('nmms_lang',lang); },[lang]);
  React.useEffect(()=>{ sl('nmms_q',questions); },[questions]);
  React.useEffect(()=>{ sl('nmms_m',materials); },[materials]);
  React.useEffect(()=>{ sl('nmms_t',mockTests); },[mockTests]);
  React.useEffect(()=>{ sl('nmms_p',papers); },[papers]);
  React.useEffect(()=>{ sl('nmms_a',anns); },[anns]);
  React.useEffect(()=>{ sl('nmms_d',daily); },[daily]);
  React.useEffect(()=>{ sl('nmms_admin',admin); },[admin]);

  const t  = k => T[lang][k] || k;
  const tx = (en,ta) => lang==='ta'?ta:en;
  const nav = (p,data=null) => { setPage(p); setPD(data); window.scrollTo(0,0); };
  const showToast = (msg,type='success') => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  // Hidden admin access: click logo 5 times quickly
  const handleLogoCl = () => {
    const next = logoClicks+1;
    setLC(next);
    if(next>=5){ setSAL(true); setLC(0); }
    setTimeout(()=>setLC(0),3000);
  };

  const adminLogin = (pw) => {
    if(pw==='nmms@admin2025'){ setAdmin(true); setSAL(false); nav('admin'); return true; }
    return false;
  };
  const adminLogout = () => { setAdmin(false); nav('home'); };

  // CRUD helpers
  const addQ  = q   => { setQuestions(p=>[...p,{...q,id:newId()}]); showToast('Question added!'); };
  const editQ = q   => { setQuestions(p=>p.map(x=>x.id===q.id?q:x)); showToast('Question updated!'); };
  const delQ  = id  => { setQuestions(p=>p.filter(x=>x.id!==id)); showToast('Deleted','error'); };

  const addM  = m   => { setMaterials(p=>[...p,{...m,id:newId()}]); showToast('Material added!'); };
  const editM = m   => { setMaterials(p=>p.map(x=>x.id===m.id?m:x)); showToast('Material updated!'); };
  const delM  = id  => { setMaterials(p=>p.filter(x=>x.id!==id)); showToast('Deleted','error'); };

  const addT  = t2  => { setMockTests(p=>[...p,{...t2,id:newId()}]); showToast('Test created!'); };
  const editT = t2  => { setMockTests(p=>p.map(x=>x.id===t2.id?t2:x)); showToast('Test updated!'); };
  const delT  = id  => { setMockTests(p=>p.filter(x=>x.id!==id)); showToast('Deleted','error'); };

  const addP  = p2  => { setPapers(p=>[...p,{...p2,id:newId()}]); showToast('Paper added!'); };
  const editP = p2  => { setPapers(p=>p.map(x=>x.id===p2.id?p2:x)); showToast('Paper updated!'); };
  const delP  = id  => { setPapers(p=>p.filter(x=>x.id!==id)); showToast('Deleted','error'); };

  const addA  = a   => { setAnns(p=>[...p,{...a,id:newId()}]); showToast('Announcement published!'); };
  const editA = a   => { setAnns(p=>p.map(x=>x.id===a.id?a:x)); showToast('Updated!'); };
  const delA  = id  => { setAnns(p=>p.filter(x=>x.id!==id)); showToast('Deleted','error'); };

  const setDailyQuiz = dq => { setDaily(dq); showToast('Daily quiz updated!'); };

  const resetDemo = () => {
    setQuestions(DEMO_QUESTIONS); setMaterials(DEMO_MATERIALS);
    setMockTests(DEMO_TESTS); setPapers(DEMO_PAPERS);
    setAnns(DEMO_ANNS); setDaily(DEMO_DAILY);
    showToast('All data reset to demo!');
  };

  return (
    <Ctx.Provider value={{lang,setLang,dark,setDark,admin,adminLogin,adminLogout,page,pageData,nav,t,tx,showToast,toast,handleLogoCl,showAdminLogin,setSAL,
      questions,addQ,editQ,delQ,
      materials,addM,editM,delM,
      mockTests,addT,editT,delT,
      papers,addP,editP,delP,
      anns,addA,editA,delA,
      daily,setDailyQuiz,resetDemo}}>
      {children}
    </Ctx.Provider>
  );
}
const useApp = () => React.useContext(Ctx);

function Badge({c='blue',children}){
  const m={blue:'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300',green:'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300',orange:'bg-orange-100 text-orange-700 dark:bg-orange-900 dark:text-orange-300',red:'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300',purple:'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300',gray:'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300',yellow:'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300'};
  return <span className={`badge ${m[c]||m.blue}`}>{children}</span>;
}

function Btn({children,onClick,v='primary',sz='md',cls='',disabled=false,type='button'}){
  const vs={primary:'bg-blue-600 hover:bg-blue-700 text-white shadow-sm',secondary:'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200',success:'bg-green-600 hover:bg-green-700 text-white shadow-sm',danger:'bg-red-600 hover:bg-red-700 text-white shadow-sm',outline:'border-2 border-blue-600 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30',warning:'bg-yellow-500 hover:bg-yellow-600 text-white shadow-sm'};
  const ss={sm:'px-3 py-1.5 text-xs',md:'px-4 py-2 text-sm',lg:'px-6 py-3 text-base'};
  return <button type={type} onClick={onClick} disabled={disabled} className={`${vs[v]||vs.primary} ${ss[sz]||ss.md} rounded-xl font-semibold transition-all duration-150 ${disabled?'opacity-40 cursor-not-allowed':''} ${cls}`}>{children}</button>;
}

function Card({children,cls='',onClick}){
  return <div onClick={onClick} className={`bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 ${onClick?'cursor-pointer card-hover':''} ${cls}`}>{children}</div>;
}

function Inp({label,type='text',value,onChange,placeholder,required,cls='',rows}){
  const base = "w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm";
  return (
    <div className={cls}>
      {label && <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{label}</label>}
      {rows ? <textarea rows={rows} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} required={required} className={base}/> : <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} required={required} className={base}/>}
    </div>
  );
}

function Sel({label,value,onChange,opts,cls=''}){
  return (
    <div className={cls}>
      {label && <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{label}</label>}
      <select value={value} onChange={e=>onChange(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
        {opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
      </select>

  );
}

function Modal({open,onClose,title,children,wide=false}){
  if(!open)return null;
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div className={`bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full ${wide?'max-w-4xl':'max-w-2xl'} max-h-[92vh] overflow-y-auto fade-in`} onClick={e=>e.stopPropagation()}>

function PBar({v,c='blue'}){
  const m={blue:'bg-blue-500',green:'bg-green-500',orange:'bg-orange-500',purple:'bg-purple-500',red:'bg-red-500',yellow:'bg-yellow-500'};
  return <div className="progress-bar"><div className={`progress-fill ${m[c]||m.blue}`} style={{width:`${Math.min(100,Math.max(0,v))}%`}}/></div>;
}

function Toast(){
  const {toast}=useApp();
  if(!toast)return null;
  const c={success:'bg-emerald-500',error:'bg-red-500',info:'bg-blue-500'};
  return <div className={`fixed bottom-5 right-5 z-[100] ${c[toast.type]||c.success} text-white px-5 py-3 rounded-2xl shadow-2xl fade-in flex items-center gap-2 text-sm font-semibold`}>{toast.type==='success'?'✅':toast.type==='error'?'🗑️':'ℹ️'} {toast.msg}</div>;
}

/* ═══════════════════════════════════════════
   QUIZ ENGINE (reusable)
═══════════════════════════════════════════ */
function QuizEngine({qs,title,duration,onFinish}){
  const {lang,t}=useApp();
  const [cur,setCur]=React.useState(0);
  const [ans,setAns]=React.useState({});
  const [marked,setMarked]=React.useState({});
  const [done,setDone]=React.useState(false);
  const [tLeft,setTLeft]=React.useState(duration?duration*60:null);
  const [startT]=React.useState(Date.now());
  const [showNav,setShowNav]=React.useState(false);

  React.useEffect(()=>{
    if(!tLeft||done)return;
    const iv=setInterval(()=>setTLeft(x=>{if(x<=1){setDone(true);return 0;}return x-1;}),1000);
    return()=>clearInterval(iv);
  },[tLeft,done]);

  const total=qs.length;
  const correct=qs.filter(q=>ans[q.id]===q.ans).length;
  const wrong=Object.keys(ans).filter(id=>ans[id]!==qs.find(q=>q.id==id)?.ans).length;
  const attempted=Object.keys(ans).length;
  const pct=total?Math.round((correct/total)*100):0;
  const taken=Math.floor((Date.now()-startT)/1000);

  if(done){
    return(
      <div className="max-w-3xl mx-auto px-4 py-8 fade-in space-y-6">
        <div className={`text-center p-8 rounded-2xl text-white ${pct>=40?'bg-gradient-to-br from-green-500 to-green-600':'bg-gradient-to-br from-red-500 to-red-600'}`}>
          <div className="text-6xl mb-3">{pct>=40?'🏆':'📚'}</div>
          <div className="text-5xl font-extrabold mb-1">{pct}%</div>
          <div className="text-xl font-semibold">{pct>=40?'Great job! Keep it up!':'Keep practicing!'}</div>
          <div className="text-white/80 text-sm mt-1">{title}</div>
        </div>
        <div className="grid grid-cols-3 gap-3 sm:grid-cols-6">
          {[[t('total'),total,'📋','blue'],[t('attempted'),attempted,'✏️','purple'],[t('correctA'),correct,'✅','green'],[t('wrongA'),wrong,'❌','red'],[t('unanswered'),total-attempted,'⬜','gray'],[t('timeTaken'),fmt(taken),'⏱️','orange']].map(([l,v,i,c])=>(
            <Card key={l} cls="text-center p-3"><div className="text-2xl mb-1">{i}</div><div className={`text-xl font-extrabold text-${c}-600 dark:text-${c}-400`}>{v}</div><div className={`text-xs text-gray-500 dark:text-gray-400 mt-0.5 ${lang==='ta'?'tamil':''}`}>{l}</div></Card>
          ))}
        </div>
        <div>
          <h3 className={`text-lg font-bold text-gray-900 dark:text-white mb-4 ${lang==='ta'?'tamil':''}`}>📋 {t('reviewAns')}</h3>
          <div className="space-y-4">
            {qs.map((q,idx)=>{
              const ua=ans[q.id],ok=ua===q.ans;
              return(
                <Card key={q.id} cls={`border-l-4 ${ok?'border-green-500':ua?'border-red-400':'border-gray-300 dark:border-gray-600'}`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="w-7 h-7 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold text-gray-600 dark:text-gray-400">Q{idx+1}</span>
                    <Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge>
                    <Badge c="gray">{q.subj}</Badge>
                    <span className="ml-auto">{ok?'✅':ua?'❌':'⬜'}</span>
                  </div>
                  <div className={`text-gray-900 dark:text-white font-medium mb-3 text-sm ${lang==='ta'?'tamil':''}`}>{lang==='ta'?q.q_ta:q.q_en}</div>
                  {!ok&&ua&&<div className={`text-sm text-red-600 dark:text-red-400 mb-1 ${lang==='ta'?'tamil':''}`}><span className="font-bold">{t('yourAns')}: </span>{lang==='ta'?q[`${ua}_ta`]:q[`${ua}_en`]}</div>}
                  <div className={`text-sm text-green-700 dark:text-green-400 mb-2 ${lang==='ta'?'tamil':''}`}><span className="font-bold">{t('correctAns')}: </span>{lang==='ta'?q[`${q.ans}_ta`]:q[`${q.ans}_en`]}</div>
                  <div className={`text-xs bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-700/50 p-2.5 rounded-xl text-yellow-800 dark:text-yellow-300 ${lang==='ta'?'tamil':''}`}>💡 {lang==='ta'?q.exp_ta:q.exp_en}</div>
                </Card>
              );
            })}
          </div>
        </div>
        <div className="flex gap-3 flex-wrap">
          <Btn onClick={()=>{setAns({});setMarked({});setCur(0);setDone(false);setTLeft(duration?duration*60:null);}}>🔄 {t('retake')}</Btn>
          {onFinish&&<Btn onClick={()=>onFinish({correct,total,pct,taken})} v="secondary">← Back</Btn>}
        </div>
      </div>
    );
  }

  const q=qs[cur];
  return(
    <div className="max-w-4xl mx-auto px-4 py-6 fade-in">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>

        </div>
        <div className="flex items-center gap-2">

      </div>
      {showNav&&(
        <Card cls="mb-4">
          <div className="text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">{t('qNav')}</div>

            {qs.map((_,i)=><button key={i} onClick={()=>{setCur(i);setShowNav(false);}} className={`w-9 h-9 rounded-xl text-sm font-bold transition ${i===cur?'bg-blue-600 text-white':ans[qs[i].id]?'bg-green-500 text-white':marked[qs[i].id]?'bg-yellow-400 text-white':'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}>{i+1}</button>)}
          </div>
          <div className="flex flex-wrap gap-3 text-xs text-gray-500 dark:text-gray-400">
            <span><span className="inline-block w-3 h-3 bg-blue-600 rounded mr-1"/>{t('answered')}: {attempted}</span>
            <span><span className="inline-block w-3 h-3 bg-gray-300 dark:bg-gray-600 rounded mr-1"/>{t('notAns')}: {total-attempted}</span>
            <span><span className="inline-block w-3 h-3 bg-yellow-400 rounded mr-1"/>{t('markedRev')}: {Object.keys(marked).length}</span>
          </div>
        </Card>
      )}
      <Card cls="mb-4">
        <div className="flex flex-wrap gap-2 mb-4"><Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge><Badge c="gray">{q.subj}</Badge><Badge c="purple">{q.diff}</Badge><Badge c="orange">{q.topic}</Badge></div>
        <div className={`text-gray-900 dark:text-white font-medium text-base leading-relaxed mb-6 ${lang==='ta'?'tamil':''}`}>{lang==='ta'?q.q_ta:q.q_en}</div>
        <div className="grid sm:grid-cols-2 gap-3">
          {['a','b','c','d'].map(opt=>{
            const txt=lang==='ta'?q[`${opt}_ta`]:q[`${opt}_en`];
            const isSel=ans[q.id]===opt;
            return<button key={opt} onClick={()=>setAns(a=>({...a,[q.id]:opt}))} className={`option-btn p-4 rounded-xl text-left text-sm font-medium border-2 transition ${isSel?'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-200':'border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:border-blue-300'}`}><span className="font-bold mr-2">{opt.toUpperCase()}.</span>{lang==='ta'?<span className="tamil">{txt}</span>:txt}</button>;
          })}
        </div>
      </Card>
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex gap-2">
          <Btn onClick={()=>setCur(c=>Math.max(0,c-1))} disabled={cur===0} v="secondary">{t('prev')}</Btn>
          <Btn onClick={()=>setMarked(m=>({...m,[q.id]:!m[q.id]}))} v="secondary" sz="sm">{marked[q.id]?'🔖 Marked':'🔖 '+t('markReview')}</Btn>
          {ans[q.id]&&<Btn onClick={()=>setAns(a=>{const n={...a};delete n[q.id];return n;})} v="secondary" sz="sm">{t('clearResp')}</Btn>}
        </div>
        <div className="flex gap-2">
          {cur<total-1?<Btn onClick={()=>setCur(c=>c+1)}>{t('next')}</Btn>:<Btn onClick={()=>setDone(true)} v="success">{t('submitTest')}</Btn>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   DAILY QUIZ PAGE
═══════════════════════════════════════════ */
function DailyQuizPage(){
  const {lang,t,questions,daily}=useApp();
  const q=questions.find(x=>x.id===daily.qid)||questions[0];
  const [a,setA]=React.useState(null);
  const [sub,setSub]=React.useState(false);
  if(!q)return<div className="text-center py-20 text-gray-400">No daily quiz set. Admin can set one from Admin Panel.</div>;
  return(
    <div className="max-w-2xl mx-auto px-4 py-8 fade-in">
      <div className="text-center mb-8">
        <div className="text-5xl mb-3">🎯</div>
        <h1 className={`text-2xl font-extrabold text-gray-900 dark:text-white ${lang==='ta'?'tamil':''}`}>{t('dailyQuiz')}</h1>
        <p className="text-gray-500 dark:text-gray-400 text-sm mt-1">{new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
      </div>
      <Card>
        <div className="flex flex-wrap gap-2 mb-4"><Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge><Badge c="gray">{q.subj}</Badge><Badge c="orange">{q.topic}</Badge></div>
        <div className={`text-gray-900 dark:text-white font-medium text-base leading-relaxed mb-6 ${lang==='ta'?'tamil':''}`}>{lang==='ta'?q.q_ta:q.q_en}</div>
        <div className="grid sm:grid-cols-2 gap-3 mb-5">
          {['a','b','c','d'].map(opt=>{
            const txt=lang==='ta'?q[`${opt}_ta`]:q[`${opt}_en`];
            const isSel=a===opt,isOk=opt===q.ans;
            let cls='border-2 border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:border-blue-300';
            if(sub){if(isOk)cls='border-2 border-green-500 bg-green-50 dark:bg-green-900/30 text-green-800 dark:text-green-200';else if(isSel)cls='border-2 border-red-400 bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-200';}
            else if(isSel)cls='border-2 border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-200';
            return<button key={opt} onClick={()=>{if(!sub)setA(opt);}} className={`option-btn p-4 rounded-xl text-left text-sm font-medium ${cls}`}><span className="font-bold mr-2">{opt.toUpperCase()}.</span>{lang==='ta'?<span className="tamil">{txt}</span>:txt}</button>;
          })}
        </div>
        {!sub?<Btn onClick={()=>{if(a)setSub(true);}} disabled={!a} cls="w-full" sz="lg">{t('submit')}</Btn>:(
          <div className={`p-4 rounded-xl ${a===q.ans?'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-700':'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700'}`}>
            <div className={`font-bold text-lg mb-1.5 ${a===q.ans?'text-green-700 dark:text-green-400':'text-red-600 dark:text-red-400'}`}>{a===q.ans?t('correct'):t('wrong')}</div>
            {a!==q.ans&&<div className={`text-sm text-gray-700 dark:text-gray-300 mb-1 ${lang==='ta'?'tamil':''}`}><span className="font-bold">{t('correctAns')}: </span>{lang==='ta'?q[`${q.ans}_ta`]:q[`${q.ans}_en`]}</div>}
            <div className={`text-sm text-gray-700 dark:text-gray-300 ${lang==='ta'?'tamil':''}`}><span className="font-bold">💡 {t('explanation')}: </span>{lang==='ta'?q.exp_ta:q.exp_en}</div>
          </div>
        )}
      </Card>
    </div>
  );
}

    {k:'papers',i:'📅',l:'Previous Papers'},{k:'quizzes',i:'🎯',l:'Daily Quiz'},
    {k:'anns',i:'📢',l:'Announcements'},{k:'settings',i:'⚙️',l:'Settings'},
  ];

  const stats=[
    ['📋',questions.length,'Questions','blue'],[' 📚',materials.length,'Materials','green'],
    ['📝',mockTests.length,'Mock Tests','purple'],['📅',papers.length,'Papers','orange'],
    ['📢',anns.filter(a=>a.published).length,'Announcements','red'],['✅',mockTests.filter(t=>t.status==='published').length,'Published Tests','teal'],
  ];

  const renderTab=()=>{
    switch(tab){
      /* ─── DASHBOARD ─── */
      case 'dashboard': return(
        <div className="space-y-6 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">📊 Admin Dashboard</h2>
            <Btn onClick={adminLogout} v="danger" sz="sm">🚪 Logout</Btn>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
            {stats.map(([i,v,l,c])=>(
              <Card key={l} cls="text-center"><div className="text-3xl mb-2">{i}</div><div className={`text-3xl font-extrabold text-${c}-600 dark:text-${c}-400`}>{v}</div><div className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{l}</div></Card>
            ))}
          </div>
          <div className="grid md:grid-cols-2 gap-5">
            <Card>
              <h3 className="font-bold text-gray-900 dark:text-white mb-4">⚡ Quick Actions</h3>
              <div className="grid grid-cols-2 gap-2">
                <Btn onClick={()=>{setTab('questions');openModal('addQ');}} v="secondary" cls="justify-start">➕ Add Question</Btn>
                <Btn onClick={()=>{setTab('materials');openModal('addM');}} v="secondary" cls="justify-start">📚 Add Material</Btn>
                <Btn onClick={()=>{setTab('tests');openModal('addT');}} v="secondary" cls="justify-start">📝 Create Test</Btn>
                <Btn onClick={()=>{setTab('anns');openModal('addA');}} v="secondary" cls="justify-start">📢 Announce</Btn>
                <Btn onClick={()=>{setTab('quizzes');}} v="secondary" cls="justify-start">🎯 Set Daily Quiz</Btn>
                <Btn onClick={()=>{setTab('papers');openModal('addP');}} v="secondary" cls="justify-start">📅 Add Paper</Btn>
              </div>
            </Card>
            <Card>
              <h3 className="font-bold text-gray-900 dark:text-white mb-4">📝 Latest Questions</h3>
              <div className="space-y-2">
                {questions.slice(-5).reverse().map(q=>(
                  <div key={q.id} className="flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-700 rounded-xl">
                    <Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge>
                    <span className="text-xs text-gray-700 dark:text-gray-300 truncate flex-1">{q.q_en}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>
      );

      /* ─── QUESTIONS ─── */
      case 'questions': return(
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">❓ Question Bank <span className="text-lg text-gray-400 font-normal">({filteredQ.length}/{questions.length})</span></h2>
            <Btn onClick={()=>openModal('addQ')}>➕ Add Question</Btn>
          </div>
          {/* Filters */}
          <Card cls="p-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="relative col-span-2 sm:col-span-1"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span><input value={qFilter.search} onChange={e=>setQFilter(f=>({...f,search:e.target.value}))} placeholder="Search…" className="w-full pl-9 pr-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/></div>
              <Sel value={qFilter.cat} onChange={v=>setQFilter(f=>({...f,cat:v}))} opts={[{v:'all',l:'All Categories'},{v:'MAT',l:'MAT'},{v:'SAT',l:'SAT'}]}/>
              <Sel value={qFilter.subj} onChange={v=>setQFilter(f=>({...f,subj:v}))} opts={[{v:'all',l:'All Subjects'},{v:'Mental Ability',l:'Mental Ability'},{v:'Mathematics',l:'Mathematics'},{v:'Science',l:'Science'},{v:'Social Science',l:'Social Science'}]}/>
              <Sel value={qFilter.diff} onChange={v=>setQFilter(f=>({...f,diff:v}))} opts={[{v:'all',l:'All Levels'},{v:'easy',l:'Easy'},{v:'medium',l:'Medium'},{v:'hard',l:'Hard'}]}/>
            </div>
          </Card>
          <div className="space-y-3">
            {filteredQ.map(q=>(
              <Card key={q.id}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap gap-1.5 mb-1.5"><Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge><Badge c="gray">{q.subj}</Badge><Badge c={q.diff==='easy'?'green':q.diff==='hard'?'red':'yellow'}>{q.diff}</Badge><Badge c="orange">{q.topic||'No topic'}</Badge><Badge c="purple">📅 {q.yr}</Badge></div>
                    <div className="text-gray-900 dark:text-white text-sm font-medium leading-snug">{q.q_en}</div>
                    <div className="text-xs text-green-600 dark:text-green-400 mt-1">✓ Correct: {q[`${q.ans}_en`]}</div>
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <Btn onClick={()=>openModal('editQ',q)} v="secondary" sz="sm">✏️</Btn>
                    <Btn onClick={()=>askConfirm('Delete this question?',()=>delQ(q.id))} v="danger" sz="sm">🗑️</Btn>
                  </div>
                </div>
              </Card>
            ))}
            {filteredQ.length===0&&<div className="text-center py-10 text-gray-400"><div className="text-5xl mb-3">❓</div><div>No questions found.</div></div>}
          </div>
        </div>
      );

      /* ─── MATERIALS ─── */
      case 'materials': return(
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">📚 Study Materials <span className="text-lg text-gray-400 font-normal">({materials.length})</span></h2>
            <Btn onClick={()=>openModal('addM')}>➕ Add Material</Btn>
          </div>
          <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span><input value={mFilter} onChange={e=>setMFilter(e.target.value)} placeholder="Search materials…" className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/></div>
          <div className="grid sm:grid-cols-2 gap-4">
            {materials.filter(m=>mFilter===''||m.title_en.toLowerCase().includes(mFilter.toLowerCase())).map(m=>(
              <Card key={m.id}>
                <div className="flex items-start gap-3">
                  <div className="text-3xl">{m.thumb||'📄'}</div>
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap gap-1.5 mb-1"><Badge c="blue">{m.cat}</Badge><Badge c="gray">{m.type}</Badge><Badge c={m.published?'green':'gray'}>{m.published?'Published':'Draft'}</Badge></div>
                    <div className="font-bold text-gray-900 dark:text-white text-sm">{m.title_en}</div>
                    <div className="text-xs text-gray-500 dark:text-gray-400">{m.subj} · {m.topic}</div>
                    <div className="text-xs text-gray-400 mt-0.5 truncate">{m.url||'No URL'}</div>
                  </div>
                  <div className="flex flex-col gap-1 flex-shrink-0">
                    <Btn onClick={()=>openModal('editM',m)} v="secondary" sz="sm">✏️ Edit</Btn>
                    <Btn onClick={()=>editM({...m,published:!m.published})} v={m.published?'warning':'success'} sz="sm">{m.published?'Unpublish':'Publish'}</Btn>
                    <Btn onClick={()=>askConfirm('Delete this material?',()=>delM(m.id))} v="danger" sz="sm">🗑️ Delete</Btn>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );

      /* ─── MOCK TESTS ─── */
      case 'tests': return(
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">📝 Mock Tests <span className="text-lg text-gray-400 font-normal">({mockTests.length})</span></h2>
            <Btn onClick={()=>openModal('addT')}>➕ Create Test</Btn>
          </div>
          <div className="space-y-4">
            {mockTests.map(test=>(
              <Card key={test.id}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1">
                    <div className="flex flex-wrap gap-1.5 mb-1.5"><Badge c={test.status==='published'?'green':'gray'}>{test.status}</Badge><Badge c="purple">{test.qids.length} Questions</Badge><Badge c="blue">⏱️ {test.duration} min</Badge></div>
                    <div className="font-bold text-gray-900 dark:text-white">{test.title_en}</div>
                    <div className="text-sm text-gray-500 dark:text-gray-400 mt-0.5">{test.desc_en}</div>
                    <div className="text-xs text-gray-400 mt-1">Marks: {test.marks}/Q · Negative: {test.neg}</div>
                  </div>
                  <div className="flex flex-col gap-1 flex-shrink-0">
                    <Btn onClick={()=>openModal('editT',test)} v="secondary" sz="sm">✏️ Edit</Btn>
                    <Btn onClick={()=>editT({...test,status:test.status==='published'?'draft':'published'})} v={test.status==='published'?'warning':'success'} sz="sm">{test.status==='published'?'Unpublish':'Publish'}</Btn>
                    <Btn onClick={()=>askConfirm('Delete this test?',()=>delT(test.id))} v="danger" sz="sm">🗑️ Delete</Btn>
                  </div>
                </div>
              </Card>
            ))}
            {mockTests.length===0&&<div className="text-center py-10 text-gray-400"><div className="text-5xl mb-3">📝</div><div>No tests created yet.</div></div>}
          </div>
        </div>
      );

      /* ─── PAPERS ─── */
      case 'papers': return(
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">📅 Previous Papers <span className="text-lg text-gray-400 font-normal">({papers.length})</span></h2>
            <Btn onClick={()=>openModal('addP')}>➕ Add Paper</Btn>
          </div>
          <div className="space-y-3">
            {papers.map(p=>(
              <Card key={p.id}>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="flex gap-1.5 mb-1"><Badge c={p.cat==='MAT'?'blue':'green'}>{p.cat}</Badge><Badge c="gray">📅 {p.yr}</Badge><Badge c="purple">{p.qids.length} Qs</Badge></div>
                    <div className="font-bold text-gray-900 dark:text-white">{p.title}</div>
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <Btn onClick={()=>openModal('editP',p)} v="secondary" sz="sm">✏️</Btn>
                    <Btn onClick={()=>askConfirm('Delete this paper?',()=>delP(p.id))} v="danger" sz="sm">🗑️</Btn>
                  </div>
                </div>
              </Card>
            ))}
            {papers.length===0&&<div className="text-center py-10 text-gray-400"><div className="text-5xl mb-3">📅</div><div>No papers added yet.</div></div>}
          </div>
        </div>
      );

      /* ─── DAILY QUIZ ─── */
      case 'quizzes': return(
        <div className="space-y-4 fade-in">
          <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">🎯 Daily Quiz</h2>
          <Card>
            <div className="mb-4">
              <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Current Daily Quiz Question:</div>
              {(()=>{const q=questions.find(x=>x.id===daily.qid)||questions[0];return q?(<div className="p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700/50 rounded-xl"><div className="flex gap-2 mb-2"><Badge c="blue">{q.cat}</Badge><Badge c="gray">{q.subj}</Badge></div><div className="text-gray-900 dark:text-white font-medium text-sm">{q.q_en}</div><div className="text-xs text-green-600 dark:text-green-400 mt-2">✓ Answer: {q[`${q.ans}_en`]}</div></div>):(<div className="text-gray-400 text-sm">No daily quiz set.</div>);})()}
            </div>
            <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Change Daily Quiz — Select Question:</div>
            <div className="max-h-80 overflow-y-auto border border-gray-200 dark:border-gray-600 rounded-xl divide-y divide-gray-100 dark:divide-gray-700">
              {questions.map(q=>(
                <div key={q.id} onClick={()=>setDailyQuiz({qid:q.id,date:new Date().toISOString().split('T')[0]})} className={`flex items-start gap-3 p-3 cursor-pointer hover:bg-blue-50 dark:hover:bg-blue-900/20 transition ${daily.qid===q.id?'bg-blue-50 dark:bg-blue-900/20':''}`}>
                  <div className={`w-5 h-5 rounded-full border-2 mt-0.5 flex-shrink-0 ${daily.qid===q.id?'border-blue-500 bg-blue-500':'border-gray-300 dark:border-gray-500'}`}>{daily.qid===q.id&&<div className="w-full h-full rounded-full flex items-center justify-center text-white text-xs">✓</div>}</div>
                  <div className="flex-1 min-w-0"><div className="flex gap-1.5 mb-0.5"><Badge c={q.cat==='MAT'?'blue':'green'}>{q.cat}</Badge><Badge c="gray">{q.subj}</Badge></div><div className="text-xs text-gray-700 dark:text-gray-300 leading-snug">{q.q_en}</div></div>
                </div>
              ))}
            </div>
          </Card>
        </div>
      );

      /* ─── ANNOUNCEMENTS ─── */
      case 'anns': return(
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">📢 Announcements <span className="text-lg text-gray-400 font-normal">({anns.length})</span></h2>
            <Btn onClick={()=>openModal('addA')}>➕ Add Announcement</Btn>
          </div>
          <div className="space-y-3">
            {anns.map(a=>(
              <Card key={a.id}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1">
                    <div className="flex flex-wrap gap-1.5 mb-1"><Badge c="blue">{a.type}</Badge><Badge c={a.published?'green':'gray'}>{a.published?'Published':'Draft'}</Badge><span className="text-xs text-gray-400">{a.date}</span></div>
                    <div className="font-bold text-gray-900 dark:text-white">{a.title_en}</div>
                    <div className="text-sm text-gray-500 dark:text-gray-400 mt-0.5 line-clamp-2">{a.desc_en}</div>
                  </div>
                  <div className="flex flex-col gap-1 flex-shrink-0">
                    <Btn onClick={()=>openModal('editA',a)} v="secondary" sz="sm">✏️ Edit</Btn>
                    <Btn onClick={()=>editA({...a,published:!a.published})} v={a.published?'warning':'success'} sz="sm">{a.published?'Unpublish':'Publish'}</Btn>
                    <Btn onClick={()=>askConfirm('Delete this announcement?',()=>delA(a.id))} v="danger" sz="sm">🗑️ Delete</Btn>
                  </div>
                </div>
              </Card>
            ))}
            {anns.length===0&&<div className="text-center py-10 text-gray-400">No announcements yet.</div>}
          </div>
        </div>
      );

      /* ─── SETTINGS ─── */
      case 'settings': return(
        <div className="space-y-4 fade-in max-w-xl">
          <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white">⚙️ Settings</h2>
          <Card>
            <h3 className="font-bold text-gray-900 dark:text-white mb-4">Admin Credentials</h3>
            <div className="text-sm text-gray-600 dark:text-gray-400 space-y-2">
              <div className="p-3 bg-gray-50 dark:bg-gray-700 rounded-xl"><span className="font-semibold">Email / Access:</span> Click logo 5 times on any page</div>
              <div className="p-3 bg-gray-50 dark:bg-gray-700 rounded-xl"><span className="font-semibold">Default Password:</span> <code className="bg-white dark:bg-gray-600 px-2 py-0.5 rounded text-blue-600 dark:text-blue-300">nmms@admin2025</code></div>
            </div>
          </Card>
          <Card>
            <h3 className="font-bold text-gray-900 dark:text-white mb-2">Data Management</h3>
            <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">All data is stored in your browser's localStorage. Reset to restore demo content.</p>
            <Btn onClick={()=>askConfirm('Reset ALL data to demo content? This cannot be undone.',resetDemo)} v="warning">🔄 Reset to Demo Data</Btn>
          </Card>
          <Card>
            <h3 className="font-bold text-gray-900 dark:text-white mb-2">Portal Info</h3>
            <div className="text-sm text-gray-600 dark:text-gray-400 space-y-1">
              <div>📋 Questions: {questions.length}</div>
              <div>📚 Materials: {materials.length}</div>
              <div>📝 Tests: {mockTests.length} ({mockTests.filter(t=>t.status==='published').length} published)</div>
              <div>📅 Papers: {papers.length}</div>
              <div>📢 Announcements: {anns.length} ({anns.filter(a=>a.published).length} published)</div>
            </div>
          </Card>
        </div>
      );

      default: return null;
    }
  };

  return(
    <div className="flex min-h-[calc(100vh-4rem)] fade-in">
      {/* Sidebar */}
      <aside className="w-14 lg:w-56 bg-gray-900 dark:bg-gray-950 flex flex-col flex-shrink-0">
        <div className="px-3 lg:px-4 py-4 border-b border-gray-800">
          <div className="hidden lg:block text-white font-bold text-sm">Admin Panel</div>
          <div className="hidden lg:block text-gray-400 text-xs">NMMS Tamil Nadu</div>
          <div className="lg:hidden text-white font-bold text-xs text-center">ADM</div>
        </div>
        <nav className="flex-1 py-2">
          {sidebarLinks.map(l=>(
            <div key={l.k} onClick={()=>setTab(l.k)} className={`sidebar-link flex items-center gap-3 px-3 py-3 lg:px-4 ${tab===l.k?'active':'text-gray-400'}`}>
              <span className="text-xl flex-shrink-0">{l.i}</span>
              <span className="hidden lg:block text-sm font-medium">{l.l}</span>
            </div>
          ))}
        </nav>
        <div className="p-3 border-t border-gray-800">
          <button onClick={adminLogout} className="flex items-center gap-2 text-gray-400 hover:text-red-400 transition w-full">
            <span className="text-xl">🚪</span><span className="hidden lg:block text-sm font-medium">Logout</span>
          </button>
        </div>
      </aside>

      {/* Main content */}
      <main className="flex-1 overflow-auto bg-gray-50 dark:bg-gray-900 min-h-0">
        <div className="p-4 lg:p-8 max-w-6xl">{renderTab()}</div>
      </main>

      {/* Modals */}
      <Modal open={modal?.type==='addQ'||modal?.type==='editQ'} onClose={closeModal} title={modal?.type==='addQ'?'➕ Add Question':'✏️ Edit Question'} wide>
        <QuestionForm init={modal?.data} onSave={d=>{modal?.type==='addQ'?addQ(d):editQ({...d,id:modal.data.id});closeModal();}} onCancel={closeModal}/>
      </Modal>
      <Modal open={modal?.type==='addM'||modal?.type==='editM'} onClose={closeModal} title={modal?.type==='addM'?'➕ Add Material':'✏️ Edit Material'} wide>
        <MaterialForm init={modal?.data} onSave={d=>{modal?.type==='addM'?addM(d):editM({...d,id:modal.data.id});closeModal();}} onCancel={closeModal}/>
      </Modal>
      <Modal open={modal?.type==='addT'||modal?.type==='editT'} onClose={closeModal} title={modal?.type==='addT'?'➕ Create Mock Test':'✏️ Edit Mock Test'} wide>
        <MockTestForm init={modal?.data} questions={questions} onSave={d=>{modal?.type==='addT'?addT(d):editT({...d,id:modal.data.id});closeModal();}} onCancel={closeModal}/>
      </Modal>
      <Modal open={modal?.type==='addP'||modal?.type==='editP'} onClose={closeModal} title={modal?.type==='addP'?'➕ Add Previous Paper':'✏️ Edit Previous Paper'} wide>
        <PaperForm init={modal?.data} questions={questions} onSave={d=>{modal?.type==='addP'?addP(d):editP({...d,id:modal.data.id});closeModal();}} onCancel={closeModal}/>
      </Modal>
      <Modal open={modal?.type==='addA'||modal?.type==='editA'} onClose={closeModal} title={modal?.type==='addA'?'➕ Add Announcement':'✏️ Edit Announcement'} wide={false}>
        <AnnForm init={modal?.data} onSave={d=>{modal?.type==='addA'?addA(d):editA({...d,id:modal.data.id});closeModal();}} onCancel={closeModal}/>
      </Modal>

      {/* Confirm dialog */}
      {confirm&&(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in">
            <div className="text-5xl text-center mb-4">⚠️</div>
            <h3 className="text-lg font-bold text-gray-900 dark:text-white text-center mb-2">Confirm</h3>
            <p className="text-gray-500 dark:text-gray-400 text-center text-sm mb-6">{confirm.msg}</p>
            <div className="flex gap-3">
              <Btn onClick={()=>{confirm.onYes();setConfirm(null);}} v="danger" cls="flex-1">Yes, Delete</Btn>
              <Btn onClick={()=>setConfirm(null)} v="secondary" cls="flex-1">Cancel</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          <div>
            <div className="text-white font-semibold mb-3 text-sm">Quick Links</div>
            {[['home','🏠 Home'],['studyMaterials','📚 Study Materials'],['mockTests','📝 Mock Tests'],['previousPapers','📅 Previous Papers'],['dailyQuiz','🎯 Daily Quiz']].map(([k,l])=>(
              <button key={k} onClick={()=>nav(k)} className="block text-sm hover:text-white transition mb-1.5">{l}</button>
            ))}
          </div>
          <div>
            <div className="text-white font-semibold mb-3 text-sm">Subjects</div>
            {['🧠 Mental Ability (MAT)','📐 Mathematics (SAT)','🔬 Science (SAT)','🌍 Social Science (SAT)','📖 Language'].map(s=>(
              <div key={s} className="text-sm mb-1.5">{s}</div>
            ))}
          </div>
          <div>
            <div className="text-white font-semibold mb-3 text-sm">About NMMS</div>
            <p className="text-sm leading-relaxed mb-3">National Means-cum-Merit Scholarship Scheme for meritorious students of Class 8 from economically weaker sections.</p>
            <div className="text-xs text-gray-500">🔐 Admin: Click logo 5× to login</div>
          </div>
        </div>
        <div className="border-t border-gray-800 pt-6 text-center text-xs text-gray-500">
          © 2025 NMMS Tamil Nadu – Bilingual Learning Portal | Open Source | Built for Tamil Nadu Class 8 Students 🎓
        </div>
      </div>
    </footer>
  );
}

/* ═══════════════════════════════════════════
   ROUTER
═══════════════════════════════════════════ */
function App(){
  const {page}=useApp();
  const pages={
    home:HomePage,login:()=>null,register:()=>null,
    studyMaterials:StudyMaterialsPage,mockTests:MockTestsPage,
    previousPapers:PreviousPapersPage,dailyQuiz:DailyQuizPage,
    announcements:AnnouncementsPage,progress:()=><div className="max-w-2xl mx-auto px-4 py-16 text-center"><div className="text-6xl mb-4">📊</div><h2 className="text-2xl font-bold text-gray-900 dark:text-white mb-2">Progress Coming Soon</h2><p className="text-gray-400">Progress tracking will be available in the next update.</p></div>,
    admin:AdminDashboard,search:SearchPage,practiceQuiz:PracticeQuizPage,
  };
  const Page=pages[page]||HomePage;
  return(
    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 font-inter">
      <Navbar/>
      <main><Page/></main>
      {page!=='admin'&&<Footer/>}
      <AdminLoginModal/>
      <Toast/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App/></AppProvider>);
</script>
</body>
