  { id:8, question_en:"What is 15% of 200?", question_ta:"200-ல் 15% என்ன?", option_a_en:"25", option_a_ta:"25", option_b_en:"30", option_b_ta:"30", option_c_en:"35", option_c_ta:"35", option_d_en:"40", option_d_ta:"40", correct_answer:"b", explanation_en:"15% of 200 = (15/100)×200 = 30", explanation_ta:"200-ல் 15% = (15/100)×200 = 30", category:"SAT", subject:"Mathematics", topic:"Percentage", difficulty:"easy", year:2021, medium:"both" },
  { id:9, question_en:"The area of a rectangle is 48 cm². If length is 8 cm, find the breadth.", question_ta:"ஒரு செவ்வகத்தின் பரப்பளவு 48 செ.மீ². நீளம் 8 செ.மீ. என்றால், அகலம் என்ன?", option_a_en:"5 cm", option_a_ta:"5 செ.மீ", option_b_en:"6 cm", option_b_ta:"6 செ.மீ", option_c_en:"7 cm", option_c_ta:"7 செ.மீ", option_d_en:"8 cm", option_d_ta:"8 செ.மீ", correct_answer:"b", explanation_en:"Area = Length × Breadth. 48 = 8 × Breadth. Breadth = 6 cm", explanation_ta:"பரப்பளவு = நீளம் × அகலம். 48 = 8 × அகலம். அகலம் = 6 செ.மீ", category:"SAT", subject:"Mathematics", topic:"Area and Perimeter", difficulty:"easy", year:2023, medium:"both" },
  { id:10, question_en:"Simplify: (x² - 9) ÷ (x - 3)", question_ta:"எளிமையாக்கு: (x² - 9) ÷ (x - 3)", option_a_en:"x - 3", option_a_ta:"x - 3", option_b_en:"x + 3", option_b_ta:"x + 3", option_c_en:"x² + 3", option_c_ta:"x² + 3", option_d_en:"x + 9", option_d_ta:"x + 9", correct_answer:"b", explanation_en:"x²-9=(x+3)(x-3). Divided by (x-3) gives (x+3)", explanation_ta:"x²-9=(x+3)(x-3). (x-3) ஆல் வகுக்க (x+3) கிடைக்கும்", category:"SAT", subject:"Mathematics", topic:"Algebra", difficulty:"medium", year:2022, medium:"both" },

  { id:12, question_en:"Which organelle is called the powerhouse of the cell?", question_ta:"செல்லின் சக்தி மையம் என அழைக்கப்படும் உறுப்பு எது?", option_a_en:"Nucleus", option_a_ta:"கரு", option_b_en:"Mitochondria", option_b_ta:"மைட்டோகாண்ட்ரியா", option_c_en:"Ribosome", option_c_ta:"ரிபோசோம்", option_d_en:"Vacuole", option_d_ta:"வெற்றிடம்", correct_answer:"b", explanation_en:"Mitochondria produces ATP energy for the cell, hence called the powerhouse.", explanation_ta:"மைட்டோகாண்ட்ரியா செல்லுக்கு ATP ஆற்றலை உருவாக்குகிறது.", category:"SAT", subject:"Science", topic:"Cell Biology", difficulty:"easy", year:2022, medium:"both" },
  { id:13, question_en:"Which planet is closest to the Sun?", question_ta:"சூரியனுக்கு மிக அருகில் உள்ள கோளம் எது?", option_a_en:"Venus", option_a_ta:"வீனஸ்", option_b_en:"Earth", option_b_ta:"பூமி", option_c_en:"Mercury", option_c_ta:"புதன்", option_d_en:"Mars", option_d_ta:"செவ்வாய்", correct_answer:"c", explanation_en:"Mercury is the closest planet to the Sun in our solar system.", explanation_ta:"புதன் கோளம் நம் சூரிய குடும்பத்தில் சூரியனுக்கு மிக அருகில் உள்ளது.", category:"SAT", subject:"Science", topic:"Solar System", difficulty:"easy", year:2021, medium:"both" },

const getLS = (key, def) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } };
const setLS = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };
const fmtTime = (s) => { const m = Math.floor(s/60); const sec = s%60; return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; };
const getExamDays = () => { const exam = new Date('2026-11-20'); const now = new Date(); return Math.max(0, Math.ceil((exam-now)/(1000*60*60*24))); };
const todayTip = tipsOfDay[new Date().getDay() % tipsOfDay.length];

const AppContext = React.createContext(null);

function AppProvider({ children }) {
  const [lang, setLang] = React.useState(getLS('nmms_lang','en'));
  const [dark, setDark] = React.useState(getLS('nmms_dark',false));
  const [user, setUser] = React.useState(getLS('nmms_user',null));
  const [page, setPage] = React.useState('home');
  const [pageData, setPageData] = React.useState(null);
  const [questions, setQuestions] = React.useState(getLS('nmms_questions', demoQuestions));
  const [materials, setMaterials] = React.useState(getLS('nmms_materials', demoMaterials));
  const [mockTests, setMockTests] = React.useState(getLS('nmms_tests', demoMockTests));
  const [announcements, setAnnouncements] = React.useState(getLS('nmms_ann', demoAnnouncements));
  const [previousPapers, setPreviousPapers] = React.useState(getLS('nmms_papers', demoPreviousPapers));
  const [users, setUsers] = React.useState(getLS('nmms_users', [{ id:1, name:'Demo Student', email:'student@demo.com', password:'demo123', role:'student', school:'Govt. High School', district:'Chennai', streak:5, badges:['🏆','⭐','🔥'] }]));
  const [progress, setProgress] = React.useState(getLS('nmms_progress', { mat:62, mathematics:75, science:58, socialScience:70, sat:68, testsTaken:3, quizAttempts:12, avgScore:68, highestScore:85, questionsAttempted:45, materialsViewed:4, streak:5, recentActivity:[ {type:'test',text:'Completed MAT Practice Test - Score: 80%',date:'Today'}, {type:'quiz',text:'Daily Quiz answered correctly',date:'Yesterday'}, {type:'material',text:'Viewed Mathematics Formula Sheet',date:'2 days ago'} ] }));
  const [dailyQuiz] = React.useState({ question: questions[0], answered: getLS('nmms_dq_answered', false), userAnswer: getLS('nmms_dq_answer', null) });

  React.useEffect(() => { document.documentElement.classList.toggle('dark', dark); setLS('nmms_dark', dark); }, [dark]);
  React.useEffect(() => { setLS('nmms_lang', lang); }, [lang]);
  React.useEffect(() => { setLS('nmms_questions', questions); }, [questions]);
  React.useEffect(() => { setLS('nmms_materials', materials); }, [materials]);
  React.useEffect(() => { setLS('nmms_tests', mockTests); }, [mockTests]);
  React.useEffect(() => { setLS('nmms_ann', announcements); }, [announcements]);
  React.useEffect(() => { setLS('nmms_users', users); }, [users]);
  React.useEffect(() => { setLS('nmms_user', user); }, [user]);
  React.useEffect(() => { setLS('nmms_progress', progress); }, [progress]);

  const t = (key) => translations[lang][key] || key;
  const nav = (p, data=null) => { setPage(p); setPageData(data); window.scrollTo(0,0); };

  const login = (email, password, role) => {
    if (role === 'admin' && email === 'admin@nmms.in' && password === 'admin123') {
      const adminUser = { id:0, name:'Admin Teacher', email, role:'admin' };
      setUser(adminUser); return { ok:true };
    }
    const found = users.find(u => u.email === email && u.password === password && u.role === 'student');
    if (found) { setUser(found); return { ok:true }; }
    return { ok:false, error:'Invalid credentials' };
  };

  const register = (data) => {
    if (users.find(u => u.email === data.email)) return { ok:false, error:'Email already registered' };
    const newUser = { ...data, id: Date.now(), role:'student', streak:0, badges:[] };
    setUsers(prev => [...prev, newUser]);
    setUser(newUser);
    return { ok:true };
  };

  const logout = () => { setUser(null); nav('home'); };

  const updateProgress = (type, score) => {
    setProgress(prev => {
      const updated = { ...prev };
      if (type === 'test') { updated.testsTaken = (prev.testsTaken||0)+1; updated.avgScore = Math.round(((prev.avgScore||0)*(prev.testsTaken||0)+score)/((prev.testsTaken||0)+1)); updated.highestScore = Math.max(prev.highestScore||0, score); }
      if (type === 'quiz') { updated.quizAttempts = (prev.quizAttempts||0)+1; }
      return updated;
    });
  };

  return (
    <AppContext.Provider value={{ lang, setLang, dark, setDark, user, page, pageData, nav, t, login, register, logout, questions, setQuestions, materials, setMaterials, mockTests, setMockTests, announcements, setAnnouncements, previousPapers, setPreviousPapers, users, progress, updateProgress, dailyQuiz }}>
      {children}
    </AppContext.Provider>
  );
}
const useApp = () => React.useContext(AppContext);

function Badge({ children, color='blue' }) {
  const colors = { blue:'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300', green:'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300', orange:'bg-orange-100 text-orange-700 dark:bg-orange-900 dark:text-orange-300', red:'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300', purple:'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300', gray:'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300' };
  return <span className={`badge ${colors[color]||colors.blue}`}>{children}</span>;
}

function ProgressBar({ value, color='blue' }) {
  const colors = { blue:'bg-blue-500', green:'bg-green-500', orange:'bg-orange-500', purple:'bg-purple-500', red:'bg-red-500' };
  return <div className="progress-bar"><div className={`progress-fill ${colors[color]||colors.blue}`} style={{width:`${Math.min(100,value)}%`}}></div></div>;
}

function Card({ children, className='', onClick }) {
  return <div onClick={onClick} className={`bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 ${onClick?'cursor-pointer card-hover':''} ${className}`}>{children}</div>;
}

function Button({ children, onClick, variant='primary', size='md', className='', disabled=false, type='button' }) {
  const variants = { primary:'bg-blue-600 hover:bg-blue-700 text-white shadow-sm', secondary:'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200', success:'bg-green-600 hover:bg-green-700 text-white', danger:'bg-red-600 hover:bg-red-700 text-white', outline:'border-2 border-blue-600 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900' };
  const sizes = { sm:'px-3 py-1.5 text-sm', md:'px-4 py-2 text-sm', lg:'px-6 py-3 text-base' };
  return <button type={type} onClick={onClick} disabled={disabled} className={`${variants[variant]||variants.primary} ${sizes[size]||sizes.md} rounded-xl font-semibold transition-all duration-150 ${disabled?'opacity-50 cursor-not-allowed':''} ${className}`}>{children}</button>;
}

function Input({ label, type='text', value, onChange, placeholder, required, className='' }) {
  return (
    <div className={className}>
      {label && <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>}
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} required={required}
        className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
    </div>
  );
}

function Select({ label, value, onChange, options, className='' }) {
  return (
    <div className={className}>
      {label && <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>}
      <select value={value} onChange={e=>onChange(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-gray-100 dark:border-gray-700">
          <h2 className="text-lg font-bold text-gray-900 dark:text-white">{title}</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">&times;</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Toast({ message, type, onClose }) {
  React.useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const colors = { success:'bg-green-500', error:'bg-red-500', info:'bg-blue-500' };
  return (
    <div className={`fixed bottom-5 right-5 z-50 ${colors[type]||colors.info} text-white px-5 py-3 rounded-xl shadow-lg fade-in flex items-center gap-3`}>
      <span>{message}</span>
      <button onClick={onClose} className="text-white/80 hover:text-white">&times;</button>
    </div>
  );
}

// ============================================================
function QuizEngine({ questions: qs, title, duration, onFinish, lang, t }) {
  const [current, setCurrent] = React.useState(0);
  const [answers, setAnswers] = React.useState({});
  const [marked, setMarked] = React.useState({});
  const [submitted, setSubmitted] = React.useState(false);
  const [timeLeft, setTimeLeft] = React.useState(duration ? duration*60 : null);
  const [startTime] = React.useState(Date.now());
  const [showNav, setShowNav] = React.useState(false);

  React.useEffect(() => {
    if (!timeLeft || submitted) return;
    const interval = setInterval(() => {
      setTimeLeft(t => { if (t <= 1) { setSubmitted(true); return 0; } return t-1; });
    }, 1000);
    return () => clearInterval(interval);
  }, [timeLeft, submitted]);

  const q = qs[current];
  const total = qs.length;
  const correct = qs.filter(q => answers[q.id] === q.correct_answer).length;
  const wrong = Object.keys(answers).filter(id => answers[id] !== qs.find(q=>q.id==id)?.correct_answer).length;
  const attempted = Object.keys(answers).length;
  const unanswered = total - attempted;
  const score = correct;
  const pct = Math.round((correct/total)*100);
  const timeTaken = Math.floor((Date.now()-startTime)/1000);

  if (submitted) {
    return (
      <div className="max-w-3xl mx-auto px-4 py-8 fade-in space-y-6">
        {/* Result header */}
        <div className={`text-center p-8 rounded-2xl ${pct>=40?'bg-gradient-to-br from-green-500 to-green-600':'bg-gradient-to-br from-red-500 to-red-600'} text-white`}>
          <div className="text-6xl mb-3">{pct>=40?'🏆':'📚'}</div>
          <div className="text-5xl font-extrabold mb-1">{pct}%</div>
          <div className="text-xl font-semibold">{pct>=40?'Great job! Keep it up!':'Keep practicing!'}</div>
          <div className="text-white/80 mt-1">{title}</div>
        </div>
        {/* Stats */}
        <div className="grid grid-cols-3 gap-3 sm:grid-cols-6">
          {[
            [t('totalQuestions'),total,'📋','blue'],
            [t('attempted'),attempted,'✏️','purple'],
            [t('correctAns'),correct,'✅','green'],
            [t('wrongAns'),wrong,'❌','red'],
            [t('unanswered'),unanswered,'⬜','gray'],
            [t('timeTaken'),fmtTime(timeTaken),'⏱️','orange'],
          ].map(([label,value,icon,color])=>(
            <Card key={label} className="text-center">
              <div className="text-2xl mb-1">{icon}</div>
              <div className={`text-2xl font-extrabold text-${color}-600 dark:text-${color}-400`}>{value}</div>
              <div className={`text-xs text-gray-500 dark:text-gray-400 ${lang==='ta'?'tamil':''}`}>{label}</div>
            </Card>
          ))}
        </div>
        {/* Detailed review */}
        <div>
          <h3 className={`text-lg font-bold text-gray-900 dark:text-white mb-4 ${lang==='ta'?'tamil':''}`}>📋 {t('reviewAnswers')}</h3>
          <div className="space-y-4">
            {qs.map((q, idx) => {
              const userAns = answers[q.id];
              const isCorrect = userAns === q.correct_answer;
              return (
                <Card key={q.id} className={`border-l-4 ${isCorrect?'border-green-500':userAns?'border-red-400':'border-gray-300 dark:border-gray-600'}`}>
                  <div className="flex items-start justify-between mb-2">
                    <span className={`font-bold text-gray-500 dark:text-gray-400 text-sm`}>Q{idx+1}</span>
                    <span>{isCorrect?'✅':userAns?'❌':'⬜'}</span>
                  </div>
                  <div className={`text-gray-900 dark:text-white font-medium mb-3 ${lang==='ta'?'tamil':''}`}>{lang==='ta'?q.question_ta:q.question_en}</div>
                  {!isCorrect && userAns && (
                    <div className="text-sm mb-2 text-red-600 dark:text-red-400">
                      <span className={`font-semibold ${lang==='ta'?'tamil':''}`}>{t('yourAnswer')}: </span>
                      <span className={lang==='ta'?'tamil':''}>{lang==='ta'?q[`option_${userAns}_ta`]:q[`option_${userAns}_en`]}</span>
                    </div>
                  )}
                  <div className="text-sm text-green-700 dark:text-green-400 mb-2">
                    <span className={`font-semibold ${lang==='ta'?'tamil':''}`}>{t('correctAnswer')}: </span>
                    <span className={lang==='ta'?'tamil':''}>{lang==='ta'?q[`option_${q.correct_answer}_ta`]:q[`option_${q.correct_answer}_en`]}</span>
                  </div>
                  <div className="text-xs text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-700 p-2 rounded-lg">
                    <span className={`font-semibold ${lang==='ta'?'tamil':''}`}>{t('explanation')}: </span>
                    <span className={lang==='ta'?'tamil':''}>{lang==='ta'?q.explanation_ta:q.explanation_en}</span>
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
        <div className="flex gap-3 flex-wrap">
          <Button onClick={()=>{setAnswers({});setMarked({});setCurrent(0);setSubmitted(false);setTimeLeft(duration?duration*60:null);}}>{t('retake')}</Button>
          {onFinish && <Button onClick={()=>onFinish({score,total,pct,timeTaken})} variant="secondary">← Back</Button>}
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-4xl mx-auto px-4 py-6 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <h2 className={`text-lg font-bold text-gray-900 dark:text-white ${lang==='ta'?'tamil':''}`}>{title}</h2>
          <div className="text-sm text-gray-500 dark:text-gray-400">Q{current+1} of {total}</div>
        </div>
        <div className="flex items-center gap-3">
          {timeLeft !== null && (
            <div className={`flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-lg ${timeLeft<300?'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 timer-pulse':'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300'}`}>
              ⏱️ {fmtTime(timeLeft)}
            </div>
          )}
          <button onClick={()=>setShowNav(!showNav)} className="px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-200">
            {showNav?'Hide':'Q Map'}
          </button>
        </div>
      </div>

      {/* Progress bar */}
      <div className="mb-4">
        <div className="flex gap-1">
          {qs.map((_,i) => (
            <div key={i} onClick={()=>setCurrent(i)} className={`h-2 flex-1 rounded-full cursor-pointer transition ${i===current?'bg-blue-500':answers[qs[i].id]?'bg-green-400':marked[qs[i].id]?'bg-yellow-400':'bg-gray-200 dark:bg-gray-600'}`}/>
          ))}
        </div>
      </div>

      {/* Question nav panel */}
      {showNav && (
        <Card className="mb-4">
          <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">{t('questionNav')}</div>
          <div className="flex flex-wrap gap-2 mb-3">
            {qs.map((_,i) => (
              <button key={i} onClick={()=>{setCurrent(i);setShowNav(false);}} className={`w-9 h-9 rounded-lg text-sm font-bold transition ${i===current?'bg-blue-600 text-white':answers[qs[i].id]?'bg-green-500 text-white':marked[qs[i].id]?'bg-yellow-400 text-white':'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}>{i+1}</button>
            ))}
          </div>
          <div className="flex flex-wrap gap-3 text-xs text-gray-500 dark:text-gray-400">
            <span><span className="inline-block w-3 h-3 bg-blue-600 rounded mr-1"></span>{t('answered')}: {attempted}</span>
            <span><span className="inline-block w-3 h-3 bg-gray-200 dark:bg-gray-600 rounded mr-1"></span>{t('notAnswered')}: {unanswered}</span>
            <span><span className="inline-block w-3 h-3 bg-yellow-400 rounded mr-1"></span>{t('markedReview')}: {Object.keys(marked).length}</span>
          </div>
        </Card>
      )}

      {/* Question */}
      <Card className="mb-4">
        <div className="flex items-center gap-2 mb-4">
          <Badge color={q.category==='MAT'?'blue':'green'}>{q.category}</Badge>
          <Badge color="gray">{q.subject}</Badge>
          <Badge color="purple">{q.difficulty}</Badge>
        </div>
        <div className={`text-gray-900 dark:text-white font-medium text-base leading-relaxed mb-6 ${lang==='ta'?'tamil':''}`}>
          {lang==='ta'?q.question_ta:q.question_en}
        </div>
        <div className="grid sm:grid-cols-2 gap-3">
          {['a','b','c','d'].map(opt => {
            const text = lang==='ta'?q[`option_${opt}_ta`]:q[`option_${opt}_en`];
            const isSelected = answers[q.id]===opt;
            return (
              <button key={opt} onClick={()=>setAnswers(a=>({...a,[q.id]:opt}))}
                className={`option-btn p-4 rounded-xl text-left text-sm font-medium border-2 transition ${isSelected?'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-200':'border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:border-blue-300 hover:bg-blue-50/50 dark:hover:border-blue-600'}`}>
                <span className="font-bold mr-2">{opt.toUpperCase()}.</span>
                {lang==='ta'?<span className="tamil">{text}</span>:text}
              </button>
            );
          })}
        </div>
      </Card>

      {/* Controls */}
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex gap-2">
          <Button onClick={()=>setCurrent(c=>Math.max(0,c-1))} disabled={current===0} variant="secondary">← {t('previous')}</Button>
          <Button onClick={()=>setMarked(m=>({...m,[q.id]:!m[q.id]}))} variant="secondary" size="sm">
            {marked[q.id]?'🔖 Marked':'🔖 '+t('markReview')}
          </Button>
        </div>
        <div className="flex gap-2">
          {current < total-1 ? (
            <Button onClick={()=>setCurrent(c=>c+1)}>{t('next')} →</Button>
          ) : (
            <Button onClick={()=>setSubmitted(true)} variant="success">{t('submitTest')}</Button>
          )}
        </div>
      </div>
    </div>
  );
}

  const { t, lang, questions, pageData } = useApp();
  const qs = pageData?.questions || questions.slice(0,10);
  const title = pageData?.title || (lang==='ta'?'பயிற்சி வினாடி வினா':'Practice Quiz');
  return <QuizEngine questions={qs} title={title} duration={null} lang={lang} t={t} onFinish={null}/>;
}

              {filtered.tests.map(t=>(
                <Card key={t.id} className="mb-2" onClick={()=>nav('mockTests')}>
                  <div className="font-semibold text-gray-900 dark:text-white">{lang==='ta'?t.title_ta:t.title_en}</div>
                  <div className="text-sm text-gray-500 dark:text-gray-400">{t.total_questions} questions • {t.duration} min</div>
                </Card>
              ))}
            </div>
          )}
          {filtered.questions.length===0 && filtered.materials.length===0 && filtered.tests.length===0 && (
            <div className="text-center py-12"><div className="text-5xl mb-4">🔍</div><div className="text-gray-500 dark:text-gray-400">No results found for "{q}"</div></div>
          )}
        </div>
      )}
      {!filtered && q.length===0 && (
        <div className="text-center py-12 text-gray-400"><div className="text-5xl mb-4">🔍</div><div>Start typing to search...</div></div>
      )}
    </div>
  );
}

          <div>

// ============================================================
// MAIN APP ROUTER
// ============================================================
function App() {
  const { page, pageData, lang, t, questions } = useApp();

  const renderPage = () => {
    switch(page) {
      case 'home': return <HomePage/>;
      case 'login': return <LoginPage/>;
      case 'register': return <RegisterPage/>;
      case 'studyMaterials': return <StudyMaterialsPage/>;
      case 'mockTests': return <MockTestsPage/>;
      case 'previousPapers': return <PreviousYearsPage/>;
      case 'dailyQuiz': return <DailyQuizPage/>;
      case 'progress': return <ProgressPage/>;
      case 'announcements': return <AnnouncementsPage/>;
      case 'admin': return <AdminDashboard/>;
      case 'search': return <SearchPage/>;
      case 'practiceQuiz': return <PracticeQuizPage/>;
      default: return <HomePage/>;
    }
  };

  return (
    <div className={`min-h-screen bg-gray-50 dark:bg-gray-900 font-inter`}>
      <Navbar/>
      <main>{renderPage()}</main>
      {page !== 'admin' && <Footer/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <AppProvider>
    <App/>
  </AppProvider>
);
</script>
</body>
</html>
